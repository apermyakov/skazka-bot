{# Shared CSS for Lalaka templates. Included via {% include %} to keep one source of truth. #}
<style>
  :root{
    --bg:#fbf7ff; --ink:#241c44; --muted:#6b6390;
    --accent:#7c5cff; --accent2:#ff7eb6;
    --card:#fff; --soft:#f1ebff; --line:#e4dcfb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);min-height:100%}
  body{
    font-family:'Manrope','Noto Sans JP','Noto Sans KR','Noto Sans Arabic',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    line-height:1.55;letter-spacing:-0.01em;
    background:
      radial-gradient(1200px 600px at 20% -10%, #f6e8ff 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #ffe7f0 0%, transparent 60%),
      var(--bg);
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 22px}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:14px;flex-wrap:wrap}
  /* Brand wordmark — image-based (g02 from OpenAI GPT-5 Image, soft purple Lalaka + pink heart) */
  .brand{display:inline-block;text-decoration:none;line-height:0;
    direction:ltr;unicode-bidi:isolate}
  .brand img{display:block;height:34px;width:auto}
  @media(max-width:480px){ .brand img{height:30px} }
  a{color:var(--accent)}
  /* Language picker (footer-mounted: dropdown opens upward) */
  .lang-pick{position:relative;display:inline-block}
  .lang-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
    color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;
    box-shadow:0 2px 8px rgba(43,35,80,.05)}
  .lang-btn:hover{background:var(--soft);border-color:var(--accent)}
  .lang-menu{position:absolute;bottom:calc(100% + 6px);inset-inline-start:0;background:#fff;border-radius:14px;
    box-shadow:0 12px 40px rgba(43,35,80,.18);padding:6px;display:none;min-width:220px;z-index:50;
    max-height:60vh;overflow-y:auto}
  .lang-menu.open{display:block}
  .lang-menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500;text-align:start}
  .lang-menu a:hover{background:var(--soft)}
  .lang-menu a.active{background:var(--soft);font-weight:700;color:var(--accent)}
  .lang-menu a .flag{font-size:18px;line-height:1}
  /* Shared bits */
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
       font-weight:800;font-size:18px;padding:15px;border-radius:14px;cursor:pointer;
       box-shadow:0 8px 20px rgba(124,92,255,.30)}
  .btn:hover{filter:brightness(1.04)}
  .btn:disabled{opacity:.7;cursor:wait}
  .btn-block{width:100%}
  .btn2{background:#fff;color:var(--accent);border:1.5px solid var(--accent);
    font:inherit;font-weight:700;font-size:15px;padding:11px 16px;border-radius:12px;cursor:pointer}
  .ghost{color:var(--muted);text-decoration:none;font-size:14px}
  .card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(43,35,80,.07)}
  .muted{color:var(--muted)}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .hint.warn{color:#c7800f}
  .hint.err{color:#c0392b;font-weight:600}
  .invalid{border-color:#e8a2a2 !important}
  footer{color:var(--muted);font-size:12.5px;padding:30px 0;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    border-top:1px solid var(--line);margin-top:30px}
  footer .ftr-text{direction:ltr;unicode-bidi:isolate;text-align:start;flex:1 1 auto;min-width:0}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  [dir="rtl"] footer .ftr-text{text-align:end}
  @media(max-width:540px){
    footer{justify-content:center;text-align:center;flex-direction:column-reverse;gap:12px}
    footer .ftr-text{text-align:center}
  }
  /* Counter "0 / 2000" stays LTR even on RTL pages so digits don't flip */
  .counter{direction:ltr;unicode-bidi:isolate}
  /* Photo→hero comparison block */
  .compare{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(43,35,80,.07);
    margin:0 0 14px}
  .compare figure{margin:0;flex:1 1 220px;max-width:300px}
  .compare img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
  .compare figcaption{margin-top:8px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
  .compare .arrow{flex:0 0 auto;font-size:34px;color:var(--accent);font-weight:800;line-height:1;
    transform:none}
  [dir="rtl"] .compare .arrow{transform:scaleX(-1)}
  @media(max-width:560px){
    .compare{flex-direction:column}
    .compare .arrow{transform:rotate(90deg);font-size:28px}
    [dir="rtl"] .compare .arrow{transform:rotate(90deg) scaleX(-1)}
  }
  /* Spinner */
  .spin{display:inline-block;width:18px;height:18px;border:2px solid #cdc1ee;border-top-color:var(--accent);
    border-radius:50%;animation:sp .9s linear infinite;vertical-align:-3px;margin-inline-end:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
