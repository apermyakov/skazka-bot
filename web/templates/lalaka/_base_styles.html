{# Shared CSS for Lalaka templates. Included via {% include %} to keep one source of truth. #}
<style>
  :root{
    --bg:#fbf7ff; --ink:#241c44; --muted:#6b6390;
    --accent:#7c5cff; --accent2:#ff7eb6;
    --card:#fff; --soft:#f1ebff; --line:#e4dcfb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);min-height:100%}
  body{
    font-family:'Manrope','Noto Sans JP','Noto Sans KR','Noto Sans Arabic',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    line-height:1.55;letter-spacing:-0.01em;
    background:
      radial-gradient(1200px 600px at 20% -10%, #f6e8ff 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #ffe7f0 0%, transparent 60%),
      var(--bg);
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 22px}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:22px;letter-spacing:-0.02em;color:var(--ink);text-decoration:none;
    /* Force LTR for brand name regardless of page direction (so Arabic doesn't show ".Lalaka") */
    direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center}
  .brand .mark{display:inline-block;width:30px;height:30px;flex:0 0 auto;margin-inline-end:8px;
    background-repeat:no-repeat;background-position:center;background-size:contain;
    background-image:url('/static/lalaka_brand_transparent.png')}
  .brand .dot{color:var(--accent)}
  a{color:var(--accent)}
  /* Language picker */
  .lang-pick{position:relative}
  .lang-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
    color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;
    box-shadow:0 2px 8px rgba(43,35,80,.05)}
  .lang-btn:hover{background:var(--soft)}
  .lang-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:#fff;border-radius:14px;
    box-shadow:0 12px 40px rgba(43,35,80,.18);padding:6px;display:none;min-width:220px;z-index:50;
    max-height:60vh;overflow-y:auto}
  .lang-menu.open{display:block}
  .lang-menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500}
  .lang-menu a:hover{background:var(--soft)}
  .lang-menu a.active{background:var(--soft);font-weight:700;color:var(--accent)}
  .lang-menu a .flag{font-size:18px;line-height:1}
  /* Shared bits */
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
       font-weight:800;font-size:18px;padding:15px;border-radius:14px;cursor:pointer;
       box-shadow:0 8px 20px rgba(124,92,255,.30)}
  .btn:hover{filter:brightness(1.04)}
  .btn:disabled{opacity:.7;cursor:wait}
  .btn-block{width:100%}
  .btn2{background:#fff;color:var(--accent);border:1.5px solid var(--accent);
    font:inherit;font-weight:700;font-size:15px;padding:11px 16px;border-radius:12px;cursor:pointer}
  .ghost{color:var(--muted);text-decoration:none;font-size:14px}
  .card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(43,35,80,.07)}
  .muted{color:var(--muted)}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .hint.warn{color:#c7800f}
  .hint.err{color:#c0392b;font-weight:600}
  .invalid{border-color:#e8a2a2 !important}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 0}
  /* Keep mixed-script footer (© / year / Lalaka / lang / links) in stable LTR order */
  footer{direction:ltr;unicode-bidi:isolate}
  [dir="rtl"] footer{text-align:center}
  /* Counter "0 / 2000" stays LTR even on RTL pages so digits don't flip */
  .counter{direction:ltr;unicode-bidi:isolate}
  /* Spinner */
  .spin{display:inline-block;width:18px;height:18px;border:2px solid #cdc1ee;border-top-color:var(--accent);
    border-radius:50%;animation:sp .9s linear infinite;vertical-align:-3px;margin-inline-end:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
