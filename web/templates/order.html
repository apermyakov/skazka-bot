<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«{{ story_title }}» — Сказик</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-180.png">
<meta name="theme-color" content="#7c5cff">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Сказик">
<meta property="og:title" content="«{{ story_title }}» — персональная сказка">
<meta property="og:description" content="Личная аудиосказка с иллюстрациями и видео, где главный герой — ребёнок.">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:url" content="https://skazik.app/order/{{ oid }}">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--bg:#fbf7ff;--ink:#2b2350;--muted:#6b6390;--accent:#7c5cff;--accent2:#ff7eb6;--card:#fff;--soft:#f1ebff;--ok:#1faa59}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;font-family:'Manrope',-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;letter-spacing:-0.01em}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px 50px}
  header{padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:22px;text-decoration:none;color:var(--ink)}.logo span{color:var(--accent)}
  .ftr{text-align:center;padding:26px 0 36px;color:var(--muted);font-size:13px}.ftr a{color:var(--muted)}
  .card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 6px 20px rgba(43,35,80,.06);margin-top:14px}
  h1{font-size:23px;margin:2px 0 12px;line-height:1.25}
  .spin{display:inline-block;width:34px;height:34px;border:4px solid #e4dcfb;border-top-color:var(--accent);
        border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
  @keyframes s{to{transform:rotate(360deg)}}
  .muted{color:var(--muted)}
  .story{background:var(--soft);border-radius:14px;padding:22px 24px;max-height:420px;overflow:auto;margin:14px 0;overflow-wrap:break-word;
         font-size:17px;line-height:1.7;color:#3a2f6b}
  .story p{margin:0 0 14px}.story p:last-child{margin-bottom:0}
  .story .story-title{margin:0 0 14px;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-0.01em}
  .story::-webkit-scrollbar{width:8px}
  .story::-webkit-scrollbar-track{background:transparent}
  .story::-webkit-scrollbar-thumb{background:#c9b8ff;border-radius:4px}
  @media(min-width:680px){ .story{font-size:18px;padding:26px 30px;max-height:460px} }
  .stepper{display:flex;gap:6px;margin:14px 0 10px;justify-content:space-between}
  .stepper .step{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:#f1ebff;color:var(--muted);font-size:12px;font-weight:700}
  .stepper .step.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .stepper .step.done{background:#e0d4ff;color:var(--ink)}
  .stepper .step .em{font-size:20px;display:block;margin-bottom:2px}
  .pbar{height:8px;background:#e4dcfb;border-radius:6px;overflow:hidden;margin-top:16px}
  .pbar > i{display:block;height:100%;width:2%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fill 55s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes fill{to{width:97%}}
  /* Demo preview bar: gentle slow start (~3x slower than .pbar) so users see
     the progress crawl at first, then accelerate, then ease into 95%. */
  .demo-pbar{height:8px;background:#e4dcfb;border-radius:6px;overflow:hidden;margin-top:8px}
  .demo-pbar > i{display:block;height:100%;width:1%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    animation:demoFill 55s cubic-bezier(.3,.4,.3,1) forwards}
  @keyframes demoFill{to{width:95%}}
  .etabar{height:10px;background:#e4dcfb;border-radius:6px;overflow:hidden;margin:8px 0 6px}
  .etabar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s linear}
  .eta-text{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .eta-text b{color:var(--ink)}
  .editbox{margin-top:14px}
  .editbox textarea{width:100%;min-height:64px;border:1.5px solid #e4dcfb;border-radius:12px;padding:11px;font:inherit;resize:vertical}
  .btn2{display:inline-block;margin-top:8px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);
        font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;cursor:pointer}
  .btn{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
       font-weight:800;font-size:18px;padding:16px;border-radius:14px;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.6;cursor:default}
  .ghost{display:inline-block;margin-top:10px;margin-left:8px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:600}
  .ghost:hover{color:var(--accent2)}
  .lock{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
  video{width:100%;border-radius:12px;margin:8px 0}
  audio{width:100%;margin:8px 0}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .gallery img{width:100%;border-radius:10px}
  .err{color:#c0392b}
  .preview-card{background:linear-gradient(135deg,#f5efff,#fff0f8);border-radius:14px;padding:14px 16px;margin:6px 0 14px;border:1px solid #ece4ff}
  .preview-card .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;color:var(--ink);font-size:14.5px}
  .preview-card .ph .dot{width:8px;height:8px;border-radius:50%;background:#1faa59;box-shadow:0 0 0 4px rgba(31,170,89,.18);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(31,170,89,0)}}
  .preview-card audio{margin:2px 0 0;height:38px}
  .preview-card .ph-video{width:100%;display:block;border-radius:10px;background:#000;cursor:pointer;aspect-ratio:16/9;object-fit:cover;margin:2px 0 0}
  .preview-card .ph-note{color:var(--muted);font-size:12.5px;margin-top:6px}
  .value-stack{margin:14px 0 8px;padding:14px 16px;background:var(--soft);border-radius:12px}
  .value-stack .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14.5px;color:var(--ink);gap:10px}
  .value-stack .row > span:first-child{flex:1;min-width:0}
  .value-stack .row .anchor{color:var(--muted);text-decoration:line-through;font-size:13px;white-space:nowrap}
  .value-stack .total{margin-top:8px;padding-top:10px;border-top:1px dashed #d6c9ff;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px}
  .value-stack .total .save{color:var(--ok);font-weight:700;font-size:13px;margin-left:6px}
  .guarantee{margin-top:12px;padding:11px 14px;background:#eef9f1;border:1px solid #cfecd6;border-radius:12px;display:flex;align-items:center;gap:10px;color:#1f6f3c;font-size:13.5px;line-height:1.45}
  .guarantee .gi{font-size:22px;flex-shrink:0}
  .photo-prepay{margin:14px 0 10px;padding:14px 16px;background:#f5efff;border:1.5px dashed #c9b8ff;border-radius:12px;text-align:center}
  .photo-prepay .pp-title{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px}
  .photo-prepay .pp-sub{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:10px}
  .photo-prepay .pp-btn{display:inline-block;background:#fff;color:var(--accent);border:1.5px solid var(--accent);font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
  .photo-prepay .pp-btn:hover{background:#e9e0ff}
  .photo-prepay.has-photo{background:#eef9f1;border-color:#cfecd6}
  .photo-prepay.has-photo .pp-title{color:#1f6f3c}
  .photo-prepay .pp-status{font-size:13px;margin-top:8px;color:var(--muted);min-height:16px}
  .photo-prepay .pp-status.err{color:#c0392b}
  .photo-prepay .pp-priv{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.45;display:flex;align-items:flex-start;gap:6px;justify-content:center;text-align:left;max-width:340px;margin-left:auto;margin-right:auto}
  .photo-prepay .pp-priv .pp-priv-ico{flex:0 0 auto;line-height:1.45}
  .late-email{margin:14px 0;padding:14px 16px;background:#fff8e8;border:1px solid #ffe8b0;border-radius:12px}
  .late-email .le-title{font-weight:800;color:#7a5400;font-size:15px;margin-bottom:4px}
  .late-email .le-sub{color:#8a6d2a;font-size:13px;line-height:1.45;margin-bottom:10px}
  .late-email .le-form{display:flex;gap:8px;flex-wrap:wrap}
  .late-email .le-form input{flex:1;min-width:160px;border:1.5px solid #f0d68a;border-radius:10px;padding:11px 12px;font:inherit;background:#fff}
  .late-email .le-form button{background:#7a5400;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .late-email .le-form button[disabled]{opacity:.6;cursor:default}
  .late-email .le-status{font-size:13px;margin-top:8px;color:#7a5400;min-height:18px}
  .late-email .le-status.ok{color:#1f6f3c}
  .late-email .le-status.err{color:#c0392b}
  .rate-card{margin:18px 0;padding:18px 18px 16px;background:var(--card);border:1.5px solid #e4dcfb;border-radius:14px;box-shadow:0 6px 18px rgba(43,35,80,.05)}
  .rate-card .rc-title{font-weight:700;color:var(--ink);font-size:16px;margin-bottom:10px;line-height:1.35}
  .rate-card .rc-stars{display:flex;gap:6px;font-size:34px;line-height:1;margin:2px 0 4px;user-select:none}
  .rate-card .rc-star{cursor:pointer;color:#e4dcfb;transition:transform .1s,color .15s}
  .rate-card .rc-star:hover{transform:scale(1.08)}
  .rate-card .rc-star.lit{color:#ffb800}
  .rate-card .rc-hint{color:var(--muted);font-size:13px;min-height:18px}
  .rate-card .rc-form{display:none;margin-top:12px}
  .rate-card .rc-form.on{display:block}
  .rate-card .rc-form textarea{width:100%;box-sizing:border-box;border:1.5px solid #e4dcfb;border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;min-height:64px;resize:vertical;background:#fff}
  .rate-card .rc-submit{margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
  .rate-card .rc-submit[disabled]{opacity:.6;cursor:default}
  .rate-card.bad{border-color:#ffc6c6;background:#fff4f4}
  .rate-card.thanks{text-align:center;border-color:#bfe6cf;background:#f1faf3}
  .rate-card.thanks .rc-title{color:#1f6f3c;margin-bottom:4px}
  .rate-card.thanks .rc-hint{color:#3f8a5c}
  .rate-card .rc-bad-cta{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .rate-card .rc-bad-cta a{display:inline-block;background:#fff;color:#c0392b;border:1.5px solid #ffc6c6;border-radius:10px;padding:9px 14px;text-decoration:none;font-weight:700;font-size:13.5px}
  .pay-trust{margin-top:10px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
  .pay-trust .badges{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .pay-trust .pb{display:inline-block;padding:3px 9px;background:#fff;border:1px solid #e4dcfb;border-radius:6px;font-weight:700;font-size:11px;color:#4b3f7a;letter-spacing:.02em}
  /* Sticky bottom CTA for mobile — never lose the button while reading the story */
  .sticky-pay{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 14px;background:linear-gradient(to top,#fbf7ff 60%,rgba(251,247,255,0));z-index:30;display:none;pointer-events:none}
  .sticky-pay.on{display:block}
  .sticky-pay .btn{pointer-events:auto;margin:0;box-shadow:0 8px 24px rgba(124,92,255,.32)}
  .sticky-pay .sp-note{pointer-events:auto;color:var(--muted);font-size:11.5px;text-align:center;margin-top:6px;background:rgba(251,247,255,.9);border-radius:8px;padding:2px 6px}
  @media(min-width:680px){ .sticky-pay{display:none !important} }
  body.has-sticky{padding-bottom:96px}
</style>
{{ metrika|safe }}
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/" aria-label="Сказик"><img src="/static/logo_horizontal.png" alt="Сказик" width="144" height="32" style="display:block;height:32px;width:auto"></a>
  </header>
  <div class="card" id="box">
    <div id="state"><span class="spin"></span> <span class="muted">Загрузка…</span></div>
  </div>
</div>
<footer class="ftr"><a href="/feedback" target="_blank" rel="noopener">Обратная связь</a><div style="margin-top:6px">ООО «СААС» · ИНН 3461067108</div></footer>

<script>
const OID = "{{ oid }}";
const PRICE = {{ price }};
const box = document.getElementById('state');
let timer = null;
let shownStatus = '';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}
let etaTimer = null;
function stopEta(){ if(etaTimer){ clearInterval(etaTimer); etaTimer = null; } }

let composeTimer = null;
const COMPOSE_PHRASES = [
  'Придумываю героев…',
  'Выбираю место действия…',
  'Плету сюжет…',
  'Добавляю волшебство…',
  'Подбираю слова на ночь…',
  'Расставляю акценты…',
  'Шлифую финал…',
];
function stopCompose(){ if(composeTimer){ clearInterval(composeTimer); composeTimer = null; } }
function startComposePhrases(){
  stopCompose();
  let i = 0;
  const el = document.getElementById('composephrase');
  if(!el) return;
  composeTimer = setInterval(function(){
    const next = document.getElementById('composephrase');
    if(!next){ stopCompose(); return; }
    next.style.opacity = '0';
    setTimeout(function(){
      const e2 = document.getElementById('composephrase');
      if(!e2) return;
      i = (i + 1) % COMPOSE_PHRASES.length;
      e2.textContent = COMPOSE_PHRASES[i];
      e2.style.opacity = '1';
    }, 400);
  }, 4500);
}
function startEta(startedMs){
  stopEta();
  const EST = 5 * 60; // expected ~5 min
  function tick(){
    const fill = document.getElementById('etafill');
    const left = document.getElementById('etaleft');
    const elapsedEl = document.getElementById('etaelapsed');
    if(!fill || !left || !elapsedEl){ stopEta(); return; }
    const elapsedSec = (Date.now() - startedMs) / 1000;
    const pct = Math.min(96, (elapsedSec / EST) * 96); // cap at 96% to avoid "100% but not done" feel
    fill.style.width = pct.toFixed(1) + '%';
    const remain = EST - elapsedSec;
    if(remain > 5){
      left.innerHTML = 'Осталось ~<b>' + fmtTime(remain) + '</b>';
    } else {
      left.innerHTML = '<b>Почти готово…</b>';
    }
    elapsedEl.textContent = 'прошло ' + fmtTime(elapsedSec);
  }
  tick();
  etaTimer = setInterval(tick, 1000);
}
function goal(name, params){ try{ if(window.ym) ym(109494799,'reachGoal',name,params||{}); }catch(e){} }
function once(key){ try{ if(localStorage.getItem(key)) return false; localStorage.setItem(key,'1'); return true; }catch(e){ return true; } }

function render(d){
  if(d.status === 'composing' && shownStatus === 'composing') return;  // keep the progress bar
  // Once we're on `done`, do not rebuild on every poll — that wipes the rate widget
  // textarea while the user is typing a comment.
  if(d.status === 'done' && shownStatus === 'done') return;
  if(d.status === 'generating' && shownStatus === 'generating'){
    // status unchanged → just refresh stage + progress text in place, keep ETA bar smooth
    const p = (d.progress || '').toLowerCase();
    let cur = 0;
    if (p.includes('рис') || p.includes('иллюс') || p.includes('размеч') || p.includes('референс')) cur = 1;
    if (p.includes('видео') || p.includes('собира')) cur = 2;
    document.querySelectorAll('.stepper .step').forEach(function(el, i){
      el.classList.toggle('done', i < cur);
      el.classList.toggle('active', i === cur);
    });
    const pt = document.getElementById('progtext');
    if(pt) pt.textContent = d.progress || 'Готовим сказку…';
    return;
  }
  shownStatus = d.status;
  if(d.status === 'text_ready' && once('g_lead_'+OID)) goal('lead_text');
  if((d.status === 'generating' || d.status === 'done') && once('g_purchase_'+OID)){
    goal('purchase');
    try{ (window.dataLayer=window.dataLayer||[]).push({ecommerce:{currencyCode:'RUB',
      purchase:{actionField:{id:OID,revenue:PRICE},
      products:[{id:'story',name:'Персональная сказка',price:PRICE,quantity:1}]}}}); }catch(e){}
  }
  if(d.status === 'composing'){
    box.innerHTML =
      '<b>✨ Сочиняю текст сказки…</b>'+
      '<div class="pbar"><i></i></div>'+
      '<div class="muted" id="composephrase" style="text-align:center;margin-top:14px;font-size:14px;min-height:20px;transition:opacity .4s">Придумываю героев…</div>';
    startComposePhrases();
  } else if(d.status === 'text_ready'){
    stop();
    const noEmail = !d.email;
    const emailCaptureHtml = noEmail ? (
      '<div class="late-email" id="lateemail">'+
        '<div class="le-title">📧 Сохраните ссылку на сказку</div>'+
        '<div class="le-sub">Чтобы вернуться позже или получить сказку на другом устройстве — оставьте email. Без спама.</div>'+
        '<form class="le-form" id="leform" onsubmit="return false">'+
          '<input type="email" id="leemail" placeholder="alex@mail.ru" inputmode="email" autocomplete="email" required>'+
          '<button type="submit" id="lebtn">Сохранить</button>'+
        '</form>'+
        '<div class="le-status" id="lestatus"></div>'+
      '</div>'
    ) : '';
    const hasPhoto = !!d.photo_path;
    const photoBlockHtml = '<div class="photo-prepay'+(hasPhoto?' has-photo':'')+'" id="photoprepay">'+
        (hasPhoto
          ? '<div class="pp-title">✓ Фото прикреплено</div>'+
            '<div class="pp-sub">Герой будет похож на вашего ребёнка.</div>'+
            '<label class="pp-btn" for="pp-input">🔁 Заменить фото</label>'
          : '<div class="pp-title">📷 Покажите ребёнка — он станет героем сказки</div>'+
            '<div class="pp-sub">Загрузите одно фото — ребёнок будет похож на иллюстрациях.</div>'+
            '<div class="pp-sub" style="font-size:12px;opacity:.7;margin-top:-4px">JPEG или PNG, до 10 МБ</div>'+
            '<label class="pp-btn" for="pp-input">📷 Выбрать фото</label>'
        )+
        '<input type="file" id="pp-input" accept="image/*" hidden>'+
        '<div class="pp-status" id="pp-status"></div>'+
        '<div class="pp-priv"><span class="pp-priv-ico">🔒</span><span>Фото используем только для героя сказки. Не публикуем в галерее и не показываем посторонним.</span></div>'+
      '</div>';
    const hasSurname = !!d.child_surname;
    const surnameBlockHtml = '<div class="surname-row" id="snrow" style="margin:10px 0;padding:14px 16px;background:var(--soft,#f1ebff);border-radius:14px">'+
      (hasSurname
        ? snSavedHTML(d.child_surname)
        : snFormHTML(''))+
      '</div>';
    box.innerHTML =
      '<h1>'+esc(d.title||'Ваша сказка')+'</h1>'+
      photoBlockHtml+
      surnameBlockHtml+
      // Example video block removed per feedback — pulled focus away from the
      // user's own story text below; example lives on the landing page only.
      '<div class="story"><div class="story-title">'+esc(d.title||'Ваша сказка')+'</div>'+(d.text_html||'')+'</div>'+
      emailCaptureHtml+
      '<div class="value-stack">'+
        '<div class="row"><span>🎙 Озвучка живым голосом, ~5 мин</span><span class="anchor">≈ 1 200 ₽</span></div>'+
        '<div class="row"><span>🎨 4-6 тёплых иллюстраций с ребёнком</span><span class="anchor">≈ 600 ₽</span></div>'+
        '<div class="row"><span>🎬 HD-видео для большого экрана</span><span class="anchor">≈ 500 ₽</span></div>'+
        '<div class="total"><span>Ваша цена</span><span>'+PRICE+' ₽ <span class="save">стартовая цена · до 30 июня</span></span></div>'+
      '</div>'+
      '<div class="demo-block" id="demoblock" style="margin:14px 0">'+

    html += '<a class="btn" style="margin-top:14px" href="/create">✨ Создать ещё одну сказку</a>';
    box.innerHTML = html;

        '<p style="margin:6px 0 10px"><b>Деньги уже у нас — сказку точно соберём.</b></p>'+
        '<p class="muted">Иногда генератор иллюстраций отвечает не с первого раза. Нажмите «Повторить» — обычно со второй попытки получается.</p>'+
        '<button class="btn" id="retry" style="margin-top:14px">🔄 Повторить попытку</button>'+
        '<div class="muted" style="margin-top:14px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14px">'+
          'Если не получится снова — напишите нам через '+

async function shareStory(){
  goal('share_click');
  const url = window.location.href;
  const h1 = document.querySelector('h1');
  const title = (h1 ? h1.textContent.replace('🎉','').trim() : 'Сказка');
  const text = 'Сделал персональную сказку для своего ребёнка — «' + title + '». Послушай!';
  try {
    if (navigator.share) { await navigator.share({ title, text, url }); }
    else {
      await navigator.clipboard.writeText(text + '\n' + url);
      const sh = document.getElementById('share');
      if (sh) { const o = sh.textContent; sh.textContent = '✓ Скопировано'; setTimeout(()=>{sh.textContent=o;}, 1800); }
      else { alert('Ссылка скопирована'); }
    }
  } catch (e) { /* user canceled */ }
}

async function uploadPhotoPrepay(ev){
  const input = ev.target;
  const wrap = document.getElementById('photoprepay');
  const status = document.getElementById('pp-status');
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 10 * 1024 * 1024){
    status.textContent = 'Фото больше 10 МБ. Сожмите и попробуйте ещё раз.';
    status.className = 'pp-status err';
    input.value = '';
    goal('photo_upload_error', {reason:'too_large', size_kb: Math.round(file.size/1024)});
    return;
  }
  goal('photo_upload_start', {size_kb: Math.round(file.size/1024)});
  status.textContent = 'Загружаю…';
  status.className = 'pp-status';
  try{
    const fd = new FormData(); fd.append('photo', file);
    const r = await fetch('/order/'+OID+'/photo', {method:'POST', body: fd});
    const d = await r.json();
    if(d.ok){
      goal('photo_upload_success', {size_kb: Math.round(file.size/1024)});
      wrap.classList.add('has-photo');
      wrap.querySelector('.pp-title').textContent = '✓ Фото прикреплено';
      wrap.querySelector('.pp-sub').textContent = 'Герой будет похож на вашего ребёнка.';
      wrap.querySelector('.pp-btn').textContent = '🔁 Заменить фото';
      // Show thumbnail of uploaded image
      let thumb = wrap.querySelector('.pp-thumb');
      if(!thumb){
        thumb = document.createElement('img');
        thumb.className = 'pp-thumb';
        thumb.style.cssText = 'display:block;width:80px;height:80px;object-fit:cover;border-radius:10px;margin:6px auto 10px;box-shadow:0 4px 12px rgba(43,35,80,.18)';
        wrap.querySelector('.pp-title').insertAdjacentElement('afterend', thumb);
      }
      try { thumb.src = URL.createObjectURL(file); } catch(e){}
      status.textContent = '';
    } else {
      status.textContent = 'Не получилось загрузить — попробуйте другой файл.';
      status.className = 'pp-status err';
      input.value = '';
      goal('photo_upload_error', {reason:'server'});
    }
  } catch(e){
    status.textContent = 'Сетевая ошибка, попробуйте ещё раз.';
    status.className = 'pp-status err';
    input.value = '';
    goal('photo_upload_error', {reason:'network'});
  }
}

let _rateChosen = 0;
function wireRate(){
  const stars = document.getElementById('rc-stars');
  if(!stars) return;
  const hint = document.getElementById('rc-hint');
  const form = document.getElementById('rc-form');
  const card = document.getElementById('rate-card');
  const submit = document.getElementById('rc-submit');
  const HINTS = ['', '😔 Жаль…', '😕 Так себе', '🙂 Нормально', '😊 Хорошо', '🤩 Супер!'];
  function light(n){
    Array.from(stars.children).forEach(function(s, i){
      s.classList.toggle('lit', i < n);
    });
  }
  stars.addEventListener('mouseover', function(e){
    const t = e.target.closest('.rc-star');
    if(!t) return;
    light(+t.dataset.n);
  });
  stars.addEventListener('mouseleave', function(){ light(_rateChosen); });
  stars.addEventListener('click', function(e){
    const t = e.target.closest('.rc-star');
    if(!t) return;
    _rateChosen = +t.dataset.n;
    light(_rateChosen);
    hint.textContent = HINTS[_rateChosen] || '';
    if(form) form.classList.add('on');
    if(_rateChosen <= 2){
      card.classList.add('bad');
      const tq = card.querySelector('.rc-title');
      if(tq) tq.textContent = 'Жаль 😔 Что не так?';
      const ta = document.getElementById('rc-comment');
      if(ta) ta.placeholder = 'Опишите — переделаем бесплатно или вернём деньги';
    } else {
      card.classList.remove('bad');
    }
  });
  if(submit) submit.onclick = sendRate;
}
async function sendRate(){
  if(!_rateChosen) return;
  const btn = document.getElementById('rc-submit');
  const ta = document.getElementById('rc-comment');
  const card = document.getElementById('rate-card');
  if(btn){ btn.disabled = true; btn.textContent = 'Отправляем…'; }
  try{
    const fd = new FormData();
    fd.append('rating', _rateChosen);
    fd.append('comment', ta ? ta.value : '');
    const r = await fetch('/order/'+OID+'/rate', {method:'POST', body:fd});
    const j = await r.json().catch(function(){return {};});
    if(j && j.ok){
      const isBad = _rateChosen <= 2;
      card.outerHTML = rateThanksHTML(_rateChosen) + (isBad ? rateBadCtaHTML() : '');
    } else {
      if(btn){ btn.disabled = false; btn.textContent = 'Отправить'; }
      alert('Не получилось сохранить. Попробуйте ещё раз.');
    }
  } catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Отправить'; }
    alert('Сеть подвела. Попробуйте ещё раз.');
  }
}
function maybeAutoRateFromUrl(){
  // Email link ?rate=N → auto-submit silently
  const m = location.search.match(/[?&]rate=([1-5])(?:&|$)/);
  if(!m) return;
  const n = +m[1];
  const card = document.getElementById('rate-card');
  if(!card || card.classList.contains('thanks')) return;  // already rated
  _rateChosen = n;
  const stars = document.getElementById('rc-stars');
  if(stars) Array.from(stars.children).forEach(function(s, i){ s.classList.toggle('lit', i < n); });
  const hint = document.getElementById('rc-hint');
  if(hint) hint.textContent = 'Сохраняю вашу оценку…';
  const form = document.getElementById('rc-form');
  if(form) form.classList.add('on');
  if(n <= 2){
    card.classList.add('bad');
    const tq = card.querySelector('.rc-title');
    if(tq) tq.textContent = 'Жаль 😔';
  }
  sendRate();
  // Clean ?rate from URL so refresh doesn't re-submit
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}

  });
}

async function saveSurname(ev){
  ev.preventDefault();
  const inp = document.getElementById('sn-input');
  if(!inp) return;
  const sn = (inp.value || '').trim().slice(0, 60);
  if(!sn) return;
  const btn = ev.target.querySelector('button[type="submit"]');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  try{
    const fd = new FormData(); fd.append('surname', sn);
    const r = await fetch('/order/'+OID+'/surname', {method:'POST', body: fd});
    const d = await r.json();
    if(d.ok){
      const row = document.getElementById('snrow');
      if(row) row.innerHTML = snSavedHTML(d.surname || sn);
      wireSurname();
    } else if(btn){ btn.disabled = false; btn.textContent = 'Сохранить'; }
  } catch(e){ if(btn){ btn.disabled = false; btn.textContent = 'Сохранить'; } }
}

async function saveLateEmail(ev){
  ev.preventDefault();
  const inp = document.getElementById('leemail');
  const btn = document.getElementById('lebtn');
  const st = document.getElementById('lestatus');
  if(!inp || !btn || !st) return;
  const email = (inp.value || '').trim();
  if(!email || email.indexOf('@') < 1 || email.indexOf('.') < 0){
    st.textContent = 'Похоже на неправильный email — проверьте.';
    st.className = 'le-status err';
    return;
  }
  btn.disabled = true; btn.textContent = '…';
  st.textContent = ''; st.className = 'le-status';
  try{
    const fd = new FormData(); fd.append('email', email);
    const r = await fetch('/order/'+OID+'/email', {method:'POST', body: fd});
    const d = await r.json();
    if(d.ok){
      const wrap = document.getElementById('lateemail');
      if(wrap) wrap.innerHTML =
        '<div class="le-title">✓ Сохранили</div>'+
        '<div class="le-sub">Прислали ссылку на <b>'+esc(email)+'</b> — можно вернуться позже с любого устройства.</div>';
    } else {
      st.textContent = 'Не получилось — проверьте email и попробуйте ещё раз.';
      st.className = 'le-status err';
      btn.disabled = false; btn.textContent = 'Сохранить';
    }
  } catch(e){
    st.textContent = 'Сетевая ошибка, попробуйте ещё раз.';
    st.className = 'le-status err';
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
}

async function pay(){
  const ppWrap = document.getElementById('photoprepay');
  const hasPhoto = !!(ppWrap && ppWrap.classList.contains('has-photo'));
  goal('pay_click', {has_photo: hasPhoto ? 1 : 0});
  if(!hasPhoto) goal('photo_skipped');
  const b = document.getElementById('pay');
  if(b){ b.disabled = true; b.textContent = 'Перехожу к оплате…'; }
  try{
    const r = await fetch('/order/'+OID+'/pay', {method:'POST'});
    const d = await r.json();
    if(d.ok && d.confirmation_url){ window.location = d.confirmation_url; }
    else { alert('Не удалось начать оплату, попробуйте ещё раз'); if(b){b.disabled=false; b.textContent='💜 Оплатить '+PRICE+' ₽ и озвучить';} }
  }catch(e){ if(b){b.disabled=false; b.textContent='💜 Оплатить '+PRICE+' ₽ и озвучить';} }
}

async function editStory(){
  const ta = document.getElementById('comment');
  const c = (ta && ta.value || '').trim();
  if(!c){ if(ta) ta.focus(); return; }
  goal('story_edit_used', {len: c.length});
  const b = document.getElementById('edit');
  if(b){ b.disabled = true; b.textContent = 'Переделываю…'; }
  try{
    const fd = new FormData(); fd.append('comment', c);
    const r = await fetch('/order/'+OID+'/edit', {method:'POST', body:fd});
    if(r.ok){ shownStatus=''; start(); }
    else { alert('Не получилось переделать'); if(b){b.disabled=false; b.textContent='✏️ Переделать с правкой';} }
  }catch(e){ if(b){b.disabled=false; b.textContent='✏️ Переделать с правкой';} }
}

// Progressive poll backoff: tight at start so a status flip (paid, done) is caught
// fast, then relaxed so a long generation doesn't hammer the server.
let polling = false, pollAgeMs = 0, lastPolledStatus = '';
function nextPollDelay(){
  if (pollAgeMs < 60000) return 3000;
  if (pollAgeMs < 180000) return 6000;
  return 10000;
}
async function poll(){
  if(!polling) return;
  try{
    const r = await fetch('/order/'+OID+'/status');
    if(r.ok){
      const d = await r.json();
      if(d.status !== lastPolledStatus){ pollAgeMs = 0; lastPolledStatus = d.status; }
      render(d);
    }
  }catch(e){}
  if(polling){
    const dly = nextPollDelay();
    pollAgeMs += dly;
    timer = setTimeout(poll, dly);
  }
}
function start(){ stop(); polling = true; pollAgeMs = 0; lastPolledStatus = ''; poll(); }
function stop(){ polling = false; if(timer){ clearTimeout(timer); timer=null; } stopEta(); stopCompose(); }
start();
</script>
