<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«{{ story_title }}» — Сказик</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-180.png">
<meta name="theme-color" content="#7c5cff">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Сказик">
<meta property="og:title" content="«{{ story_title }}» — персональная сказка">
<meta property="og:description" content="Личная аудиосказка с иллюстрациями и видео, где главный герой — ребёнок.">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:url" content="https://skazik.app/order/{{ oid }}">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--bg:#fbf7ff;--ink:#2b2350;--muted:#6b6390;--accent:#7c5cff;--accent2:#ff7eb6;--card:#fff;--soft:#f1ebff;--ok:#1faa59}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;font-family:'Manrope',-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;letter-spacing:-0.01em}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px 50px}
  header{padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:22px;text-decoration:none;color:var(--ink)}.logo span{color:var(--accent)}
  .ftr{text-align:center;padding:26px 0 36px;color:var(--muted);font-size:13px}.ftr a{color:var(--muted)}
  .card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 6px 20px rgba(43,35,80,.06);margin-top:14px}
  h1{font-size:23px;margin:2px 0 12px;line-height:1.25}
  .spin{display:inline-block;width:34px;height:34px;border:4px solid #e4dcfb;border-top-color:var(--accent);
        border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
  @keyframes s{to{transform:rotate(360deg)}}
  .muted{color:var(--muted)}
  .story{background:var(--soft);border-radius:14px;padding:22px 24px;max-height:420px;overflow:auto;margin:14px 0;overflow-wrap:break-word;
         font-family:'Iowan Old Style','Charter','PT Serif',Georgia,serif;font-size:17px;line-height:1.7;color:#3a2f6b}
  .story p{margin:0 0 14px}.story p:last-child{margin-bottom:0}
  .story::-webkit-scrollbar{width:8px}
  .story::-webkit-scrollbar-track{background:transparent}
  .story::-webkit-scrollbar-thumb{background:#c9b8ff;border-radius:4px}
  @media(min-width:680px){ .story{font-size:18px;padding:26px 30px;max-height:460px} }
  .stepper{display:flex;gap:6px;margin:14px 0 10px;justify-content:space-between}
  .stepper .step{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:#f1ebff;color:var(--muted);font-size:12px;font-weight:700}
  .stepper .step.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .stepper .step.done{background:#e0d4ff;color:var(--ink)}
  .stepper .step .em{font-size:20px;display:block;margin-bottom:2px}
  .pbar{height:8px;background:#e4dcfb;border-radius:6px;overflow:hidden;margin-top:16px}
  .pbar > i{display:block;height:100%;width:2%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fill 55s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes fill{to{width:97%}}
  .etabar{height:10px;background:#e4dcfb;border-radius:6px;overflow:hidden;margin:8px 0 6px}
  .etabar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s linear}
  .eta-text{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .eta-text b{color:var(--ink)}
  .editbox{margin-top:14px}
  .editbox textarea{width:100%;min-height:64px;border:1.5px solid #e4dcfb;border-radius:12px;padding:11px;font:inherit;resize:vertical}
  .btn2{display:inline-block;margin-top:8px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);
        font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;cursor:pointer}
  .btn{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
       font-weight:800;font-size:18px;padding:16px;border-radius:14px;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.6;cursor:default}
  .ghost{display:inline-block;margin-top:10px;color:var(--muted);text-decoration:none;font-size:14px}
  .lock{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
  video{width:100%;border-radius:12px;margin:8px 0}
  audio{width:100%;margin:8px 0}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .gallery img{width:100%;border-radius:10px}
  .err{color:#c0392b}
</style>
{{ metrika|safe }}
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/" aria-label="Сказик"><img src="/static/logo_horizontal.png" alt="Сказик" width="144" height="32" style="display:block;height:32px;width:auto"></a>
  </header>
  <div class="card" id="box">
    <div id="state"><span class="spin"></span> <span class="muted">Загрузка…</span></div>
  </div>
</div>
<footer class="ftr"><a href="/feedback">Обратная связь</a></footer>

<script>
const OID = "{{ oid }}";
const PRICE = {{ price }};
const box = document.getElementById('state');
let timer = null;
let shownStatus = '';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}
let etaTimer = null;
function stopEta(){ if(etaTimer){ clearInterval(etaTimer); etaTimer = null; } }

let composeTimer = null;
const COMPOSE_PHRASES = [
  'Придумываю героев…',
  'Выбираю место действия…',
  'Плету сюжет…',
  'Добавляю волшебство…',
  'Подбираю слова на ночь…',
  'Расставляю акценты…',
  'Шлифую финал…',
];
function stopCompose(){ if(composeTimer){ clearInterval(composeTimer); composeTimer = null; } }
function startComposePhrases(){
  stopCompose();
  let i = 0;
  const el = document.getElementById('composephrase');
  if(!el) return;
  composeTimer = setInterval(function(){
    const next = document.getElementById('composephrase');
    if(!next){ stopCompose(); return; }
    next.style.opacity = '0';
    setTimeout(function(){
      const e2 = document.getElementById('composephrase');
      if(!e2) return;
      i = (i + 1) % COMPOSE_PHRASES.length;
      e2.textContent = COMPOSE_PHRASES[i];
      e2.style.opacity = '1';
    }, 400);
  }, 4500);
}
function startEta(startedMs){
  stopEta();
  const EST = 5 * 60; // expected ~5 min
  function tick(){
    const fill = document.getElementById('etafill');
    const left = document.getElementById('etaleft');
    const elapsedEl = document.getElementById('etaelapsed');
    if(!fill || !left || !elapsedEl){ stopEta(); return; }
    const elapsedSec = (Date.now() - startedMs) / 1000;
    const pct = Math.min(96, (elapsedSec / EST) * 96); // cap at 96% to avoid "100% but not done" feel
    fill.style.width = pct.toFixed(1) + '%';
    const remain = EST - elapsedSec;
    if(remain > 5){
      left.innerHTML = 'Осталось ~<b>' + fmtTime(remain) + '</b>';
    } else {
      left.innerHTML = '<b>Почти готово…</b>';
    }
    elapsedEl.textContent = 'прошло ' + fmtTime(elapsedSec);
  }
  tick();
  etaTimer = setInterval(tick, 1000);
}
function goal(name, params){ try{ if(window.ym) ym(109494799,'reachGoal',name,params||{}); }catch(e){} }
function once(key){ try{ if(localStorage.getItem(key)) return false; localStorage.setItem(key,'1'); return true; }catch(e){ return true; } }

function render(d){
  if(d.status === 'composing' && shownStatus === 'composing') return;  // keep the progress bar
  if(d.status === 'generating' && shownStatus === 'generating'){
    // status unchanged → just refresh stage + progress text in place, keep ETA bar smooth
    const p = (d.progress || '').toLowerCase();
    let cur = 0;
    if (p.includes('рис') || p.includes('иллюс') || p.includes('размеч') || p.includes('референс')) cur = 1;
    if (p.includes('видео') || p.includes('собира')) cur = 2;
    document.querySelectorAll('.stepper .step').forEach(function(el, i){
      el.classList.toggle('done', i < cur);
      el.classList.toggle('active', i === cur);
    });
    const pt = document.getElementById('progtext');
    if(pt) pt.textContent = d.progress || 'Готовим сказку…';
    return;
  }
  shownStatus = d.status;
  if(d.status === 'text_ready' && once('g_lead_'+OID)) goal('lead_text');
  if((d.status === 'generating' || d.status === 'done') && once('g_purchase_'+OID)){
    goal('purchase');
    try{ (window.dataLayer=window.dataLayer||[]).push({ecommerce:{currencyCode:'RUB',
      purchase:{actionField:{id:OID,revenue:PRICE},
      products:[{id:'story',name:'Персональная сказка',price:PRICE,quantity:1}]}}}); }catch(e){}
  }
  if(d.status === 'composing'){
    box.innerHTML =
      '<b>✨ Сочиняю текст сказки…</b>'+
      '<div class="pbar"><i></i></div>'+
      '<div class="muted" id="composephrase" style="text-align:center;margin-top:14px;font-size:14px;min-height:20px;transition:opacity .4s">Придумываю героев…</div>';
    startComposePhrases();
  } else if(d.status === 'text_ready'){
    stop();
    box.innerHTML =
      '<h1>'+esc(d.title||'Ваша сказка')+'</h1>'+
      '<div class="story">'+(d.text_html||'')+'</div>'+
      '<button class="btn" id="pay">💜 Оплатить '+PRICE+' ₽ и озвучить</button>'+
      '<div class="lock">🔒 Оплата через ЮKassa · 5-8 мин — и придёт готовое видео + аудио + 4 иллюстрации</div>'+
      '<div class="muted" style="margin-top:10px;text-align:center;font-size:13.5px">'+
        'Не уверены, как это будет звучать? <a href="/sample" target="_blank" style="color:var(--accent);font-weight:600">Посмотрите готовый пример</a></div>'+
      '<div class="editbox"><textarea id="comment" placeholder="Что изменить? Напр.: сделай короче, добавь маму, убери лису…"></textarea>'+
      '<button class="btn2" id="edit">✏️ Переделать с правкой</button> '+
      '<a class="ghost" href="/create">или новая сказка</a></div>';
    document.getElementById('pay').onclick = pay;
    document.getElementById('edit').onclick = editStory;
  } else if(d.status === 'awaiting_payment'){
    box.innerHTML = '<span class="spin"></span> <b>Проверяем оплату…</b>'+
      '<div class="muted" style="margin-top:8px">Если вы ещё не оплатили — <a href="#" id="payagain">вернуться к оплате</a>.</div>';
    const pa = document.getElementById('payagain'); if(pa){ pa.onclick = function(e){e.preventDefault(); pay();}; }
  } else if(d.status === 'generating'){
    const stages = [{em:'🎙',name:'Озвучка'},{em:'🎨',name:'Иллюстрации'},{em:'🎬',name:'Видео'}];
    const p = (d.progress || '').toLowerCase();
    let cur = 0;
    if (p.includes('рис') || p.includes('иллюс') || p.includes('размеч') || p.includes('референс')) cur = 1;
    if (p.includes('видео') || p.includes('собира')) cur = 2;
    const stepHtml = stages.map(function(s,i){
      const cls = i < cur ? 'done' : (i === cur ? 'active' : '');
      return '<div class="step '+cls+'"><span class="em">'+s.em+'</span>'+s.name+'</div>';
    }).join('');
    // ETA: persist start time per-order so reloads keep counting from real start
    const KEY = 'gen_started_'+OID;
    let started = parseInt(localStorage.getItem(KEY) || '0', 10);
    if(!started){ started = Date.now(); try{ localStorage.setItem(KEY, String(started)); }catch(e){} }
    box.innerHTML = '<b>Собираю сказку…</b>'+
      '<div class="stepper">'+stepHtml+'</div>'+
      '<div class="etabar"><i id="etafill" style="width:0%"></i></div>'+
      '<div class="eta-text"><span id="etaleft">расчёт…</span><span id="etaelapsed"></span></div>'+
      '<div class="muted" style="margin-top:10px;text-align:center"><span class="spin" style="width:16px;height:16px;border-width:3px;vertical-align:middle"></span> <span id="progtext">'+esc(d.progress || 'Готовим сказку…')+'</span></div>'+
      '<div class="muted" style="margin-top:10px;text-align:center;font-size:13px">Страницу можно закрыть — ссылку пришлём на почту.</div>';
    startEta(started);
  } else if(d.status === 'done'){
    stop();
    try{ localStorage.removeItem('gen_started_'+OID); }catch(e){}
    let html = '<h1>'+esc(d.title||'Готово!')+' 🎉</h1>';
    if(d.video_url){ html += '<video controls preload="metadata" src="'+d.video_url+'"></video>'; }
    if(d.audio_url){ html += '<audio controls src="'+d.audio_url+'"></audio>'; }
    let dl = '<button type="button" class="btn2" id="share">📤 Поделиться</button> ';
    if(d.video_url){ dl += '<a class="btn2" download href="'+d.video_url+'">⬇️ Скачать видео</a> '; }
    if(d.audio_url){ dl += '<a class="btn2" download href="'+d.audio_url+'">⬇️ Скачать аудио</a>'; }
    html += '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">'+dl+'</div>';
    if(d.email){
      html += '<div class="muted" style="margin-top:14px;padding:10px 14px;background:var(--soft);border-radius:10px;font-size:14px">'+
              '📧 Ссылка отправлена на <b>'+esc(d.email)+'</b> — можно открыть с любого устройства.</div>';
    }
    html += '<a class="btn" style="margin-top:14px" href="/create">✨ Создать ещё одну сказку</a>';
    box.innerHTML = html;
    const sh = document.getElementById('share');
    if(sh) sh.onclick = shareStory;
  } else if(d.status === 'failed'){
    stop();
    if(d.paid){
      box.innerHTML =
        '<h1 class="err">Сборка прервалась</h1>'+
        '<p style="margin:6px 0 10px"><b>Деньги уже у нас — сказку точно соберём.</b></p>'+
        '<p class="muted">Иногда генератор иллюстраций отвечает не с первого раза. Нажмите «Повторить» — обычно со второй попытки получается.</p>'+
        '<button class="btn" id="retry" style="margin-top:14px">🔄 Повторить попытку</button>'+
        '<div class="muted" style="margin-top:14px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14px">'+
          'Если не получится снова — напишите нам через '+
          '<a href="/feedback" target="_blank">форму обратной связи</a>, '+
          'сразу вернём деньги. ID заказа: <code style="font-family:ui-monospace,monospace">'+esc(OID)+'</code>'+
        '</div>';
      const r = document.getElementById('retry');
      if(r) r.onclick = retryGen;
    } else {
      box.innerHTML =
        '<h1 class="err">Что-то пошло не так</h1>'+
        '<p class="muted">Это случается редко. Попробуем ещё раз — деньги не списаны.</p>'+
        '<button class="btn" id="recompose" style="margin-top:10px">🔄 Повторить с той же темой</button>'+
        '<a class="ghost" href="/create" style="text-align:center;display:block;margin-top:10px">или начать заново с другой темой</a>';
      const rc = document.getElementById('recompose');
      if(rc) rc.onclick = async function(){
        rc.disabled = true; rc.textContent = 'Перезапускаю…';
        try {
          const r = await fetch('/order/'+OID+'/recompose', {method:'POST'});
          if(r.ok){ shownStatus=''; start(); }
          else { alert('Не получилось. Откройте /create и попробуйте заново.'); rc.disabled=false; rc.textContent='🔄 Повторить с той же темой'; }
        } catch(e){ rc.disabled=false; rc.textContent='🔄 Повторить с той же темой'; }
      };
    }
  }
}

async function retryGen(){
  const r = document.getElementById('retry');
  if(r){ r.disabled = true; r.textContent = 'Запускаю…'; }
  try {
    const resp = await fetch('/order/'+OID+'/retry', {method:'POST'});
    if (resp.ok) { shownStatus = ''; start(); }
    else { alert('Не удалось перезапустить'); if(r){r.disabled=false; r.textContent='🔄 Повторить попытку';} }
  } catch (e) { if(r){r.disabled=false; r.textContent='🔄 Повторить попытку';} }
}

async function shareStory(){
  goal('share_click');
  const url = window.location.href;
  const h1 = document.querySelector('h1');
  const title = (h1 ? h1.textContent.replace('🎉','').trim() : 'Сказка');
  const text = 'Сделал персональную сказку для своего ребёнка — «' + title + '». Послушай!';
  try {
    if (navigator.share) { await navigator.share({ title, text, url }); }
    else {
      await navigator.clipboard.writeText(text + '\n' + url);
      const sh = document.getElementById('share');
      if (sh) { const o = sh.textContent; sh.textContent = '✓ Скопировано'; setTimeout(()=>{sh.textContent=o;}, 1800); }
      else { alert('Ссылка скопирована'); }
    }
  } catch (e) { /* user canceled */ }
}

async function pay(){
  goal('pay_click');
  const b = document.getElementById('pay');
  if(b){ b.disabled = true; b.textContent = 'Перехожу к оплате…'; }
  try{
    const r = await fetch('/order/'+OID+'/pay', {method:'POST'});
    const d = await r.json();
    if(d.ok && d.confirmation_url){ window.location = d.confirmation_url; }
    else { alert('Не удалось начать оплату, попробуйте ещё раз'); if(b){b.disabled=false; b.textContent='💜 Оплатить '+PRICE+' ₽ и озвучить';} }
  }catch(e){ if(b){b.disabled=false; b.textContent='💜 Оплатить '+PRICE+' ₽ и озвучить';} }
}

async function editStory(){
  const ta = document.getElementById('comment');
  const c = (ta && ta.value || '').trim();
  if(!c){ if(ta) ta.focus(); return; }
  const b = document.getElementById('edit');
  if(b){ b.disabled = true; b.textContent = 'Переделываю…'; }
  try{
    const fd = new FormData(); fd.append('comment', c);
    const r = await fetch('/order/'+OID+'/edit', {method:'POST', body:fd});
    if(r.ok){ shownStatus=''; start(); }
    else { alert('Не получилось переделать'); if(b){b.disabled=false; b.textContent='✏️ Переделать с правкой';} }
  }catch(e){ if(b){b.disabled=false; b.textContent='✏️ Переделать с правкой';} }
}

// Progressive poll backoff: tight at start so a status flip (paid, done) is caught
// fast, then relaxed so a long generation doesn't hammer the server.
let polling = false, pollAgeMs = 0, lastPolledStatus = '';
function nextPollDelay(){
  if (pollAgeMs < 60000) return 3000;
  if (pollAgeMs < 180000) return 6000;
  return 10000;
}
async function poll(){
  if(!polling) return;
  try{
    const r = await fetch('/order/'+OID+'/status');
    if(r.ok){
      const d = await r.json();
      if(d.status !== lastPolledStatus){ pollAgeMs = 0; lastPolledStatus = d.status; }
      render(d);
    }
  }catch(e){}
  if(polling){
    const dly = nextPollDelay();
    pollAgeMs += dly;
    timer = setTimeout(poll, dly);
  }
}
function start(){ stop(); polling = true; pollAgeMs = 0; lastPolledStatus = ''; poll(); }
function stop(){ polling = false; if(timer){ clearTimeout(timer); timer=null; } stopEta(); stopCompose(); }
start();
</script>
</body>
</html>
