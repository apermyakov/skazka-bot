<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded purple background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#7c5cff"/>

  <!-- Crescent moon: large circle minus an offset circle (mask) -->
  <defs>
    <mask id="moonMask">
      <rect width="512" height="512" fill="white"/>
      <circle cx="298" cy="232" r="135" fill="black"/>
    </mask>
  </defs>
  <circle cx="232" cy="272" r="155" fill="white" mask="url(#moonMask)"/>

  <!-- 4-point sparkle: concave diamond made with cubic bezier curves -->
  <!-- Center at (340, 200), tip-radius 76, waist-radius ~14 -->
  <path d="
    M 340 124
    C 344 174, 366 196, 416 200
    C 366 204, 344 226, 340 276
    C 336 226, 314 204, 264 200
    C 314 196, 336 174, 340 124
    Z
  " fill="white"/>
</svg>
