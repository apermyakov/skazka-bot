# lalaka.ai — origin on Hetzner. Cloudflare-proxied (orange cloud).
# Origin reverse-proxies to the same uvicorn on :8200 as skazik.app;
# host-routing middleware in web/app.py dispatches to the lalaka router.
#
# DEPLOY:
#   sudo cp /opt/skazka-bot/deploy/lalaka.ai.nginx.conf /etc/nginx/sites-available/lalaka.ai.conf
#   sudo ln -s /etc/nginx/sites-available/lalaka.ai.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lalaka.ai -d www.lalaka.ai
#   sudo systemctl reload nginx
#
# After certbot runs, it will insert SSL directives + a 443 server block
# automatically — same pattern as skazik.app.nginx.conf.

server {
    listen 80;
    server_name lalaka.ai www.lalaka.ai;

    # ACME HTTP-01 challenge passthrough (used by certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Until certbot wires the 443 block, serve traffic on :80.
    # Cloudflare proxy in front gives the public-facing TLS, so this is OK temporarily.
    # After `certbot --nginx`, certbot replaces this with a 301 → https://$host$request_uri.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml application/manifest+json;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    location /static/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CF gives us the real client IP in CF-Connecting-IP. Pass through.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
