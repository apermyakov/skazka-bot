services:
  skazka-bot:
    build: .
    container_name: skazka-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_data:/app/media
      - ./bot:/app/bot
      - ./engine:/app/engine
      - ./db:/app/db
      - ./scripts:/app/scripts
      - ./assets:/app/assets
      - ./web:/app/web
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    container_name: skazik-web
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8200", "--reload", "--reload-dir", "/app/web", "--reload-dir", "/app/engine", "--reload-dir", "/app/db"]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - media_data:/app/media
      - ./web:/app/web
      - ./engine:/app/engine
      - ./db:/app/db
      - ./scripts:/app/scripts
      - ./assets:/app/assets
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: skazka-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: skazka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: skazka
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skazka"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: skazka-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
  media_data:
